; XC-RemoteID - GB 46750-2025 compliant Remote ID firmware
; PlatformIO build configuration

[env]
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
lib_extra_dirs = lib
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -std=gnu++17
build_unflags =
    -std=gnu++11
board_build.partitions = partitions.csv

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-S3 variants
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32s3_devkit]
platform = espressif32
board    = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3_DEVKIT
    -DPIN_UART_RX=17
    -DPIN_UART_TX=18
    -DPIN_LED=48
    -DLED_WS2812=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ─────────────────────────────────────────────────────────────────────────────
; ESP32-C3 variants
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32c3_devkit]
platform = espressif32
board    = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3_DEVKIT
    -DPIN_UART_RX=20
    -DPIN_UART_TX=21
    -DPIN_LED=8
    -DLED_WS2812=1

[env:esp32c3_supermini]
platform = espressif32
board    = esp32-c3-devkitm-1
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3_SUPERMINI
    -DPIN_UART_RX=20
    -DPIN_UART_TX=21
    -DPIN_LED=8
    -DLED_WS2812=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3_supermini_mock]
; 模拟数据模式：跳过配置检查，直接进入 NORMAL 模式，使用内置模拟轨迹
; 用途：无飞控时验证 BLE/Wi-Fi 广播、存储、联锁等完整链路
platform = espressif32
board    = esp32-c3-devkitm-1
monitor_dtr = 0
monitor_rts = 0
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3_SUPERMINI
    -DPIN_UART_RX=20
    -DPIN_UART_TX=21
    -DPIN_LED=8
    -DLED_WS2812=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DMOCK_DATA

[env:xiao_esp32c3]
platform = espressif32
board    = seeed_xiao_esp32c3
build_flags =
    ${env.build_flags}
    -DBOARD_XIAO_ESP32C3
    -DPIN_UART_RX=7
    -DPIN_UART_TX=6
    -DPIN_LED=2
    -DLED_WS2812=0

; ─────────────────────────────────────────────────────────────────────────────
; ESP32 WROOM-32
; ─────────────────────────────────────────────────────────────────────────────

[env:esp32_wroom32]
platform = espressif32
board    = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_WROOM32
    -DPIN_UART_RX=16
    -DPIN_UART_TX=17
    -DPIN_LED=2
    -DLED_WS2812=0
    -DMOCK_DATA
