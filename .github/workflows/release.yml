name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - env: esp32s3_devkit
            chip: esp32s3
            flash_size: 8MB
          - env: esp32c3_supermini
            chip: esp32c3
            flash_size: 4MB
          - env: esp32c3_devkit
            chip: esp32c3
            flash_size: 4MB
          - env: xiao_esp32c3
            chip: esp32c3
            flash_size: 4MB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Package firmware
        run: |
          VERSION=${GITHUB_REF_NAME}

          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o XC-RemoteID-${{ matrix.env }}-${VERSION}.bin \
            --flash_mode keep \
            --flash_freq keep \
            --flash_size ${{ matrix.flash_size }} \
            0x0 .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0xe000 $HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: XC-RemoteID-${{ matrix.env }}-*.bin

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # 提取 "## v$VERSION" 到下一个 "## " 之间的内容
          awk -v v="## v${VERSION}" '
            $0 == v { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > version_notes.md

          {
            echo "## XC-RemoteID ${GITHUB_REF_NAME}"
            echo ""
            if [ -s version_notes.md ]; then
              cat version_notes.md
            else
              echo "_未在 CHANGELOG.md 中找到 ${GITHUB_REF_NAME} 的变更记录。_"
              echo ""
            fi
            cat <<'EOF'
          ## 固件下载

          根据你的板型选择对应固件，下载后刷写地址统一填 `0x0`：

          | 固件文件 | 适用板型 |
          |---------|---------|
          | `XC-RemoteID-esp32s3_devkit-*.bin` | ESP32-S3 DevKitC-1 |
          | `XC-RemoteID-esp32c3_supermini-*.bin` | ESP32-C3 Super Mini |
          | `XC-RemoteID-esp32c3_devkit-*.bin` | ESP32-C3 DevKit |
          | `XC-RemoteID-xiao_esp32c3-*.bin` | XIAO ESP32-C3 |

          ESP32 WROOM-32 仅用于开发调试，不随 Release 自动构建。

          ## 烧录方法

          **在线刷写（推荐）**：用 Chrome/Edge 打开 [esptool.spacehuhn.com](https://esptool.spacehuhn.com)，连接设备后 Add File，地址填 `0x0`，点击 Program。

          **命令行刷写**：

          ```bash
          esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 XC-RemoteID-esp32c3_supermini-*.bin
          ```

          ## 首次配置

          上电后连接 Wi-Fi 热点 `XC-RID-XXXXXX`（密码 `12345678`），访问 `http://10.0.0.1` 完成配置。

          > 网络式上报和防篡改/防破坏设计尚未实现，当前不应声明为完整 GB 46750-2025 成品合规版本。
          EOF
          } > release_body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: XC-RemoteID ${{ github.ref_name }}
          body_path: release_body.md
          files: firmware/*.bin
          draft: false
          prerelease: false
