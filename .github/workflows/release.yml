name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - env: esp32s3_devkit
            chip: esp32s3
            flash_size: 8MB
          - env: esp32c3_supermini
            chip: esp32c3
            flash_size: 4MB
          - env: esp32c3_devkit
            chip: esp32c3
            flash_size: 4MB
          - env: xiao_esp32c3
            chip: esp32c3
            flash_size: 4MB

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Package firmware
        run: |
          VERSION=${GITHUB_REF_NAME}

          cp .pio/build/${{ matrix.env }}/firmware.bin \
             XC-RemoteID-${{ matrix.env }}-app-${VERSION}.bin

          python -m esptool --chip ${{ matrix.chip }} merge_bin \
            -o XC-RemoteID-${{ matrix.env }}-merged-${VERSION}.bin \
            --flash_mode keep \
            --flash_freq keep \
            --flash_size ${{ matrix.flash_size }} \
            0x0 .pio/build/${{ matrix.env }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.env }}/partitions.bin \
            0xe000 $HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/${{ matrix.env }}/firmware.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: XC-RemoteID-${{ matrix.env }}-*.bin

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: XC-RemoteID ${{ github.ref_name }} 广播式运行识别测试版
          body: |
            ## XC-RemoteID ${{ github.ref_name }}

            面向 GB 46750-2025 广播式运行识别的 ESP32 固件测试版。

            ### 当前状态

            已实现 BLE/Wi-Fi 广播、GB 数据包编码、MAVLink 输入、本地滚动存储和起飞联锁。
            网络式上报和防篡改/防破坏设计尚未实现，当前不应声明为完整 GB 46750-2025 成品合规版本。

            ### 固件下载

            根据你的板型选择对应固件：

            | 固件文件 | 适用板型 | 说明 |
            |---------|---------|------|
            | `XC-RemoteID-esp32s3_devkit-merged-*.bin` | ESP32-S3 DevKitC-1 | 推荐普通用户使用，刷写地址 `0x0` |
            | `XC-RemoteID-esp32c3_supermini-merged-*.bin` | ESP32-C3 Super Mini | 推荐普通用户使用，刷写地址 `0x0` |
            | `XC-RemoteID-esp32c3_devkit-merged-*.bin` | ESP32-C3 DevKit | 推荐普通用户使用，刷写地址 `0x0` |
            | `XC-RemoteID-xiao_esp32c3-merged-*.bin` | XIAO ESP32-C3 | 推荐普通用户使用，刷写地址 `0x0` |
            | `XC-RemoteID-*-app-*.bin` | 对应板型 | 仅 app 固件，适合已有正确 bootloader 和分区表的设备升级，刷写地址 `0x10000` |

            ESP32 WROOM-32 仅用于开发调试，不随 Release 自动构建。

            ### 烧录方法

            首次刷写或不确定设备分区状态时，使用 `merged` 固件，地址 `0x0`：

            ```bash
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x0 XC-RemoteID-esp32c3_supermini-merged-*.bin
            ```

            已确认设备有正确 bootloader 和分区表时，可使用 `app` 固件升级，地址 `0x10000`：

            ```bash
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x10000 XC-RemoteID-esp32c3_supermini-app-*.bin
            ```

            ### 首次配置

            上电后连接 Wi-Fi 热点 `XC-RID-XXXXXX`（密码 `12345678`），访问 `http://10.0.0.1` 完成配置。
          files: firmware/*.bin
          draft: false
          prerelease: false
