name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        env:
          - esp32s3_devkit
          - esp32c3_supermini
          - esp32c3_devkit
          - xiao_esp32c3
          - esp32_wroom32

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.env }}

      - name: Rename firmware
        run: |
          VERSION=${GITHUB_REF_NAME}
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             XC-RemoteID-${{ matrix.env }}-${VERSION}.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: XC-RemoteID-${{ matrix.env }}-*.bin

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: firmware
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: XC-RemoteID ${{ github.ref_name }}
          body: |
            ## XC-RemoteID ${{ github.ref_name }}

            基于 ESP32 的民用无人机运行识别固件，符合 GB 46750-2025。

            ### 固件下载

            根据你的板型选择对应固件：

            | 固件文件 | 适用板型 | BLE |
            |---------|---------|-----|
            | `XC-RemoteID-esp32s3_devkit-*.bin` | ESP32-S3 DevKitC-1 | BT5 ✅ |
            | `XC-RemoteID-esp32c3_supermini-*.bin` | ESP32-C3 Super Mini | BT5 ✅ |
            | `XC-RemoteID-esp32c3_devkit-*.bin` | ESP32-C3 DevKit | BT5 ✅ |
            | `XC-RemoteID-xiao_esp32c3-*.bin` | XIAO ESP32-C3 | BT5 ✅ |
            | `XC-RemoteID-esp32_wroom32-*.bin` | ESP32 WROOM-32 | BT4.2 ⚠️ |

            ### 烧录方法

            使用 [esptool](https://github.com/espressif/esptool) 或 [ESP Flash Download Tool](https://www.espressif.com/en/support/download/other-tools) 烧录：

            ```bash
            esptool.py --port /dev/ttyUSB0 --baud 921600 write_flash 0x10000 XC-RemoteID-esp32c3_supermini-*.bin
            ```

            ### 首次配置

            上电后连接 Wi-Fi 热点 `XC-RID-XXXXXX`（密码 `12345678`），访问 `http://10.0.0.1` 完成配置。
          files: firmware/*.bin
          draft: false
          prerelease: false
